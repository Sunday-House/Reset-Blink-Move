name: Enrich PR with Jira Details

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: read
  pull-requests: write

jobs:
  jira-context:
    # Do not expose Jira credentials to fork-based PRs.
    if: github.event.pull_request.head.repo.full_name == github.repository

    runs-on: ubuntu-latest

    steps:
      - name: Fetch Jira issue and update PR
        uses: actions/github-script@v7

        env:
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          JIRA_BASE_URL: https://sundipahooja.atlassian.net

        with:
          script: |
            const pr = context.payload.pull_request;

            // Find Jira key in branch name or PR title.
            const source = `${pr.head.ref}\n${pr.title}`;
            const match = source.match(/\b([A-Z][A-Z0-9]+-\d+)\b/);

            if (!match) {
              core.warning("No Jira issue key found in branch or PR title.");
              return;
            }

            const issueKey = match[1];
            const baseUrl = process.env.JIRA_BASE_URL;

            const auth = Buffer.from(
              `${process.env.JIRA_EMAIL}:${process.env.JIRA_API_TOKEN}`
            ).toString("base64");

            // Fetch Jira issue.
            const response = await fetch(
              `${baseUrl}/rest/api/3/issue/${issueKey}?fields=summary,description,issuetype,priority,status`,
              {
                headers: {
                  Authorization: `Basic ${auth}`,
                  Accept: "application/json"
                }
              }
            );

            if (!response.ok) {
              throw new Error(
                `Jira API failed: HTTP ${response.status}`
              );
            }

            const issue = await response.json();
            const fields = issue.fields;

            // Convert Jira rich-text (ADF) description to readable text.
            function adfToText(node) {
              if (!node) return "";

              if (Array.isArray(node)) {
                return node.map(adfToText).join("");
              }

              if (node.type === "text") {
                return node.text || "";
              }

              if (node.type === "hardBreak") {
                return "\n";
              }

              const children = (node.content || [])
                .map(adfToText)
                .join("");

              if (node.type === "listItem") {
                return `- ${children.trim()}\n`;
              }

              if (
                node.type === "paragraph" ||
                node.type === "heading"
              ) {
                return children + "\n\n";
              }

              return children;
            }

            const description =
              adfToText(fields.description).trim() ||
              "_No Jira description provided._";

            const summary = fields.summary || "";
            const type = fields.issuetype?.name || "Unknown";
            const priority = fields.priority?.name || "Not specified";
            const status = fields.status?.name || "Unknown";

            const jiraBlock = [
              "<!-- jira-context:start -->",
              `## Jira Context: [${issueKey}](${baseUrl}/browse/${issueKey})`,
              `**Summary:** ${summary}`,
              `**Type:** ${type}`,
              `**Priority:** ${priority}`,
              `**Status:** ${status}`,
              "",
              "### Description and Acceptance Criteria",
              description,
              "",
              "<!-- jira-context:end -->"
            ].join("\n");

            // Replace previous Jira block instead of duplicating it.
            const oldBody = pr.body || "";
            const cleanBody = oldBody
              .replace(
                /<!-- jira-context:start -->[\s\S]*?<!-- jira-context:end -->/g,
                ""
              )
              .trim();

            const newBody = [cleanBody, jiraBlock]
              .filter(Boolean)
              .join("\n\n");

            await github.rest.pulls.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number,
              body: newBody
            });

            core.info(`Updated PR with Jira issue ${issueKey}`);
